services:
  context-engine:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/orchestrix-context-engine:${IMAGE_TAG:?Set IMAGE_TAG}
    env_file: ./context.env
    expose:
      - "8083"
    restart: unless-stopped
    networks:
      - private

  core-api:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/orchestrix-core-api:${IMAGE_TAG:?Set IMAGE_TAG}
    env_file:
      - ./shared.env
      - ./core.env
    environment:
      CONTEXT_ENGINE_URL: http://context-engine:8083
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks:
      - private

  realtime:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/orchestrix-realtime:${IMAGE_TAG:?Set IMAGE_TAG}
    env_file: ./shared.env
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped
    networks:
      - private

  frontend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/orchestrix-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - private

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
