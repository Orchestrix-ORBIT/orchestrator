server:
  port: 8082

spring:
  application:
    name: realtime-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/orchestrix_core?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:orchestrix_app}
    password: ${SPRING_DATASOURCE_PASSWORD:app_secret_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
