spring:
  application:
    name: core-api

  datasource:
    # Reads DB_HOST, DB_PORT, DB_NAME from environment with local/Supabase defaults
    url: jdbc:postgresql://${DB_HOST:db.nqmitpyrheqqrcbkwwut.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mmINekXXuCsuDloR}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  flyway:
    enabled: false                             # ← Managed manually in FlywayConfig.java
    locations: classpath:db/migration/public   # ← Read by FlywayConfig via @Value
    schemas: public                            # ← Read by FlywayConfig via @Value
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: "none"        # Managed by Flyway per tenant schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public  # Overridden per-request by TenantSchemaResolver

multitenancy:
  tenant-migrations-path: classpath:db/tenant

# JWT Configuration — reads from env with default fallback
jwt:
  secret: ${JWT_SECRET:b1a04bc7-496f-46fd-9372-352a16b9c473}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # Default: 24 hours if not set

# AES-256 Encryption Configuration
encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:My32ByteSuperSecretKeyForAES256!}