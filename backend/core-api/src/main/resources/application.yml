spring:
  application:
    name: core-api

  datasource:
    # Reads database connection parameters with explicit SPRING_DATASOURCE_* overrides to avoid OS env collisions
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/orchestrix_core?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:orchestrix_app}
    password: ${SPRING_DATASOURCE_PASSWORD:app_secret_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      data-source-properties:
        sslmode: disable

  flyway:
    enabled: false                             # ← Managed manually in FlywayConfig.java
    locations: classpath:db/migration/public   # ← Read by FlywayConfig via @Value
    schemas: public                            # ← Read by FlywayConfig via @Value
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: "none"        # Managed by Flyway per tenant schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public  # Overridden per-request by TenantSchemaResolver

multitenancy:
  tenant-migrations-path: classpath:db/tenant

# JWT Configuration — reads from environment variables with safe default
jwt:
  secret: ${JWT_SECRET:My32ByteSuperSecretKeyForJWTAuth2026!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # Default: 24 hours (86400000 ms)

# AES-256 Encryption Configuration
encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:My32ByteSuperSecretKeyForAES256!}