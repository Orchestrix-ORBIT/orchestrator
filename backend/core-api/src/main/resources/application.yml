spring:
  application:
    name: core-api

  datasource:
    # Reads database connection parameters from environment variables
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orchestrator_db}
    username: ${DB_USERNAME:orchestrix_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  flyway:
    enabled: false                             # ← Managed manually in FlywayConfig.java
    locations: classpath:db/migration/public   # ← Read by FlywayConfig via @Value
    schemas: public                            # ← Read by FlywayConfig via @Value
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: "none"        # Managed by Flyway per tenant schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public  # Overridden per-request by TenantSchemaResolver

multitenancy:
  tenant-migrations-path: classpath:db/tenant

# JWT Configuration — reads from environment variables
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # Default: 24 hours (86400000 ms)

# AES-256 Encryption Configuration
encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY}