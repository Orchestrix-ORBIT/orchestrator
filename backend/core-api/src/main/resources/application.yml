spring:
  application:
    name: core-api

  datasource:
    # Reads DB_HOST, DB_PORT, DB_NAME from .env
    # jdbc:postgresql://<host>:<port>/<database>
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  flyway:
    enabled: false                             # ← Managed manually in FlywayConfig.java
    locations: classpath:db/migration/public   # ← Read by FlywayConfig via @Value
    schemas: public                            # ← Read by FlywayConfig via @Value
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate        # ← NEVER use create/update in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public  # Overridden per-request by TenantSchemaResolver

multitenancy:
  tenant-migrations-path: classpath:db/tenant

# JWT Configuration — values come from .env
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # Default: 24 hours if not set